build_settings:
  build_image: python-3.13
  container_port: 8000
  environment_variables:
    - name: DEBUG
      value: "False"
    - name: DATABASE_URL
      from_database:
        name: db
        property: private_connection_url
    - name: ALLOWED_HOSTS
      from_domains: true
    - name: SECRET_KEY
      source: manual
    - name: ENTSOE_TOKEN
      source: manual

services:
  web:
    command: bash run.sh
  release:
    command: bash release.sh

databases:
  db:
    type: postgresql_17

cronjobs:
  fetch_prices:
    # Day-ahead prices are published around 13:00 CET; fetch hourly to be safe.
    schedule: "5 * * * *"
    command: python manage.py fetch_prices

commands:
  - python manage.py migrate
  - python manage.py createsuperuser
  - python manage.py fetch_prices --start 2026-10-01 --days 31
