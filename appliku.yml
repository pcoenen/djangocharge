build_settings:
  build_image: python-3.13
  container_port: 8000
  environment_variables:
    - name: DEBUG
      value: "False"
    - name: DATABASE_URL
      from_database:
        name: db
        property: private_connection_url
    - name: ALLOWED_HOSTS
      from_domains: true
    - name: SECRET_KEY
      source: manual
    - name: ENTSOE_TOKEN
      source: manual
    - name: TESLA_CLIENT_ID
      source: manual
    - name: TESLA_CLIENT_SECRET
      source: manual
    - name: TESLA_PRIVATE_KEY_B64
      source: manual
    - name: TESLA_HOME_LAT
      source: manual
    - name: TESLA_HOME_LON
      source: manual
    - name: DJANGO_SUPERUSER_USERNAME
      source: manual
    - name: DJANGO_SUPERUSER_PASSWORD
      source: manual

services:
  web:
    command: bash run.sh
  release:
    command: bash release.sh

databases:
  db:
    type: postgresql_17

cronjobs:
  fetchprices:
    # Day-ahead prices are published around 13:00 Belgian time. Cron runs in UTC:
    # 13:00 UTC = 14:00 CET (winter) / 15:00 CEST (summer). If prices are late,
    # the pages still fetch them on demand.
    schedule: "0 14 * * *"
    command: python manage.py fetch_prices
  energytick:
    # Reads the car's cached battery state; never wakes the car.
    schedule: "*/30 * * * *"
    command: python manage.py energy_tick

commands:
  - python manage.py migrate
  - python manage.py createsuperuser
  - python manage.py fetch_prices
