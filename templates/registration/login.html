{% extends "prices/base.html" %}
{% block title %}Log in - Dyncharge{% endblock %}
{% block content %}
<div class="card card-dyn login-card">
    <div class="card-body">
        <h5 class="card-title mb-3">Log in</h5>
        {% if form.errors %}<div class="alert alert-danger">Wrong username or password.</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" class="form-control" autofocus autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button class="btn btn-primary btn-block">Log in</button>
        </form>
    </div>
</div>
{% endblock %}
