{% extends "prices/base.html" %}
{% block content %}
<div class="mt-3">
    <div class="row justify-content-center">
        <div class="col-md-10 my-3">
            <a href="{% url 'prices:price_list' %}" class="btn btn-primary btn-lg btn-block">Price List</a>
        </div>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-10 my-3">
            <a href="{% url 'prices:dishwasher' %}" class="btn btn-primary btn-lg btn-block">Dishwasher</a>
        </div>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-10 my-3">
            <a href="{% url 'prices:car_charging' %}" class="btn btn-primary btn-lg btn-block">Car Charging</a>
        </div>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-10 my-3">
            <a href="{% url 'tesla:dashboard' %}" class="btn btn-primary btn-lg btn-block">Tesla</a>
        </div>
    </div>
    <form method="post" action="{% url 'logout' %}" class="text-center my-3">
        {% csrf_token %}
        <button class="btn btn-link text-white">Log out</button>
    </form>
</div>
{% endblock %}
